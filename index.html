<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Homebody Thrown into a Dark Captivity Novel</title>
<meta name="description" content="I woke up as an extra — an illegitimate daughter inside a romance fantasy novel. Mistakenly kidnapped by the Northern Grand Duke in place of the heroine… but this captivity is surprisingly sweet? A book-possession romance fantasy × romantic comedy.">
<meta property="og:title" content="A Homebody Thrown into a Dark Captivity Novel">
<meta property="og:description" content="The peaceful(?) captivity life of an illegitimate daughter kidnapped by mistake in place of the heroine. A book-possession romance fantasy rom-com.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/images/thumb.webp">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="alternate icon" type="image/png" href="assets/images/thumb.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Gowun+Batang:wght@400;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif:wght@400;500&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;500;600&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0a0b; --bg2:#151011; --bg3:#1b1416;
  --panel:rgba(28,20,22,.72);
  --bdr:#2c2024; --bdr2:#3a2a30;
  --gold:#d8b87e; --gold-d:#b9985f; --gold-soft:#e6cfa3;
  --rose:#e09aae; --rose-d:#c07487; --rose-soft:#f0c4d0;
  --green:#7fa890;
  --body:#d8c8c0; --muted:#9c8a86; --dim:#6f615f;
  --glow:rgba(216,184,126,.18);
  --rose-glow:rgba(224,154,174,.16);
  --fserif:'Noto Serif KR',serif;
  --ftitle:'Gowun Batang','Noto Serif KR',serif;
  --fsans:'Noto Sans KR',sans-serif;
  --flatin:'Cormorant Garamond',serif;
}
html[lang="en"]{--fserif:'Noto Serif',Georgia,serif;--ftitle:'Cinzel','Cormorant Garamond',serif;--fsans:'Noto Sans',sans-serif}
html[lang="ja"]{--fserif:'Noto Serif JP',serif;--ftitle:'Shippori Mincho B1','Noto Serif JP',serif;--fsans:'Noto Sans JP',sans-serif}
html[lang="ja"] body{word-break:auto-phrase}   /* 일본어: 문절 단위 자연 줄바꿈 (Chromium) */
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--body);
  font-family:var(--fserif); line-height:1.8;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  word-break:keep-all;        /* 단어 중간이 아닌 단어 사이에서 줄바꿈 */
  overflow-wrap:break-word;   /* 단어 하나가 너무 길 때만 보조 분리 */
  text-wrap:pretty;           /* 마지막 줄 외톨이 단어 방지 */
}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--rose-d);color:#fff}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vw 60vh at 80% -5%, rgba(224,154,174,.10), transparent 60%),
    radial-gradient(55vw 55vh at 10% 100%, rgba(216,184,126,.08), transparent 60%),
    var(--bg);
}
.petals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-6vh;font-size:14px;color:var(--rose);opacity:0;
  animation:fall linear infinite;filter:drop-shadow(0 0 4px rgba(224,154,174,.4))}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:0}
  10%{opacity:.55}
  90%{opacity:.45}
  100%{transform:translateY(110vh) rotate(320deg);opacity:0}
}

/* ===== intro w/ language select ===== */
.intro{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 35%,#1a1214,#0a0708 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:6vh 1.2rem;overflow:auto;
  transition:opacity 1s ease,visibility 1s ease}
.intro.out{opacity:0;visibility:hidden;pointer-events:none}
.intro-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.intro-bg img{width:100%;height:100%;object-fit:cover;object-position:center 28%;
  opacity:.5;filter:blur(1px) brightness(.8) saturate(1.05)}
.intro-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center 45%,transparent 28%,rgba(10,7,8,.55) 62%,rgba(10,7,8,.92) 90%,var(--bg) 100%)}
.intro-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding:0 1.2rem}
.intro-eyebrow{font-family:var(--flatin);letter-spacing:6px;text-transform:uppercase;
  color:var(--gold);font-size:clamp(.7rem,2.2vw,.86rem)}
.intro-title{font-family:var(--ftitle);font-weight:700;color:#fff;text-align:center;line-height:1.35;
  font-size:clamp(1.9rem,6.5vw,3.7rem);text-shadow:0 4px 40px rgba(0,0,0,.85),0 0 50px var(--rose-glow);text-wrap:balance}
.intro-title b{color:var(--rose-soft)}
.intro-sub{font-family:var(--flatin);color:var(--gold-soft);text-align:center;
  font-size:clamp(.82rem,2.4vw,1.06rem);letter-spacing:1.5px;line-height:1.6;max-width:90vw}
.intro-sub .bar{color:var(--dim);margin:0 .7rem}
.lang-pick{display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap;margin-top:.5rem}
.lang-pick button{font-family:'Noto Sans KR','Noto Sans JP','Noto Sans',sans-serif;font-size:.92rem;
  letter-spacing:1.5px;color:var(--gold-soft);background:rgba(20,15,16,.4);border:1px solid var(--bdr2);
  border-radius:3px;padding:.7rem 1.7rem;cursor:pointer;transition:transform .2s,border-color .2s,background .2s,color .2s}
.lang-pick button:hover,.lang-pick button:focus-visible{transform:translateY(-2px);border-color:var(--gold-d);
  background:rgba(216,184,126,.12);color:#fff;outline:none}
.lang-pick .bar{color:var(--dim);font-size:.9rem}

/* ===== site / header ===== */
.site{position:relative;z-index:5;opacity:0;transition:opacity 1s ease .2s}
.site.show{opacity:1}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(14,10,11,.92),rgba(14,10,11,.55));
  border-bottom:1px solid var(--bdr);}
.nav{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1.3rem;gap:1rem}
.brand{font-family:var(--ftitle);font-weight:700;color:var(--gold-soft);font-size:clamp(.86rem,2.1vw,1.05rem);
  letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.menu a{font-family:var(--fsans);font-size:.84rem;letter-spacing:.5px;color:var(--muted);
  padding:.45rem .55rem;transition:color .2s,text-shadow .2s;cursor:pointer}
.menu a:hover,.menu a:focus-visible{color:var(--gold-soft);outline:none}
.menu a.play{color:var(--rose-soft);font-weight:700;letter-spacing:1px;text-shadow:0 0 16px var(--rose-glow)}
.menu a.play:hover,.menu a.play:focus-visible{color:#fff;text-shadow:0 0 24px var(--rose-glow)}
.langsw{display:flex;gap:.1rem;align-items:center;margin-left:.4rem;padding-left:.6rem;border-left:1px solid var(--bdr)}
.langsw button{font-family:'Noto Sans KR','Noto Sans JP','Noto Sans',sans-serif;font-size:.74rem;letter-spacing:.5px;
  color:var(--dim);padding:.35rem .4rem;background:none;border:none;cursor:pointer;transition:color .2s}
.langsw button:hover,.langsw button:focus-visible{color:var(--gold-soft);outline:none}
.langsw button.active{color:var(--gold-soft);font-weight:700}

section{max-width:1180px;margin:0 auto;padding:clamp(3.5rem,9vw,6.5rem) 1.3rem}
.eyebrow{font-family:var(--flatin);letter-spacing:5px;text-transform:uppercase;
  color:var(--gold);font-size:.8rem;display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
.eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.eyebrow .enum{color:var(--rose-soft);font-weight:600;letter-spacing:2px}
.eyebrow .enum::after{content:"/";color:var(--dim);margin:0 .15rem 0 .5rem;font-weight:400}
.h2{font-family:var(--ftitle);font-weight:700;color:#f1e6e2;font-size:clamp(1.45rem,4.2vw,2.25rem);
  line-height:1.4;margin-bottom:1.6rem;text-wrap:balance}
.h2 small{display:block;font-family:var(--flatin);font-weight:400;color:var(--muted);
  font-size:.5em;letter-spacing:3px;text-transform:uppercase;margin-top:.5rem}

.hero{position:relative;min-height:92vh;display:flex;align-items:center;max-width:none;padding:0;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.5) saturate(1.05)}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(10,7,8,.92) 0%,rgba(10,7,8,.6) 45%,rgba(10,7,8,.25) 100%),
            linear-gradient(0deg,var(--bg) 2%,transparent 30%)}
.hero-inner{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 1.3rem;width:100%}
.hero-genre{font-family:var(--flatin);letter-spacing:6px;text-transform:uppercase;color:var(--gold);
  font-size:clamp(.74rem,2.4vw,.9rem);margin-bottom:1.1rem}
.hero h1{font-family:var(--ftitle);font-weight:700;color:#fff;
  font-size:clamp(1.7rem,5.4vw,3.2rem);line-height:1.38;max-width:22ch;
  text-shadow:0 4px 36px rgba(0,0,0,.7)}
.hero h1 b{color:var(--rose-soft);display:inline-block}
.hero-copy{margin-top:1.4rem}
.hero-copy .q{display:block;color:var(--gold-soft);font-size:clamp(1rem,2.8vw,1.28rem);
  font-family:var(--ftitle);letter-spacing:.3px;font-style:italic}
.hero-copy .b{display:block;color:var(--body);font-family:var(--fserif);
  font-size:clamp(.9rem,2.4vw,1.02rem);margin-top:.7rem;max-width:52ch;line-height:1.9;font-style:normal}
.scroll-cue{position:absolute;left:50%;bottom:2.2rem;transform:translateX(-50%);z-index:2;
  color:var(--muted);font-family:var(--flatin);letter-spacing:3px;font-size:.74rem;text-align:center;
  animation:bob 2s ease-in-out infinite}
.scroll-cue::after{content:"";display:block;width:1px;height:34px;margin:.5rem auto 0;
  background:linear-gradient(var(--gold),transparent)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}

.syn-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.4rem;align-items:start}
.syn-lead{font-size:clamp(1.02rem,2.6vw,1.25rem);color:var(--gold-soft);font-family:var(--ftitle);
  line-height:1.7;margin-bottom:1.4rem}
.syn-body p{color:var(--body);margin-bottom:1rem}
.syn-body p.punch{color:var(--rose-soft);font-family:var(--ftitle);font-size:1.1rem;line-height:1.6}
.syn-points{list-style:none;display:flex;flex-direction:column;gap:.9rem;
  background:var(--panel);border:1px solid var(--bdr);border-radius:16px;padding:1.6rem 1.5rem}
.syn-points li{position:relative;padding-left:1.7rem;color:var(--body);font-size:.94rem;line-height:1.65}
.syn-points li::before{content:"✦";position:absolute;left:0;top:.1rem;color:var(--rose)}
.syn-points b{color:var(--gold-soft);font-weight:600}

.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.3rem}
.char-card{position:relative;display:block;text-align:left;cursor:pointer;
  background:var(--bg2);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;padding:0;
  font-family:inherit;color:inherit;transition:transform .3s,border-color .3s,box-shadow .3s}
.char-card:hover,.char-card:focus-visible{transform:translateY(-6px);border-color:var(--gold-d);
  box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 28px var(--glow);outline:none}
.char-thumb{position:relative;aspect-ratio:3/4;overflow:hidden}
.char-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;
  transition:transform .5s,filter .4s;filter:saturate(.96)}
.char-card:hover .char-thumb img{transform:scale(1.06);filter:saturate(1.08) brightness(1.05)}
.char-thumb::after{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(14,10,11,.96),transparent 55%)}
.char-meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1rem 1rem 1.1rem}
.char-meta .role{font-family:var(--flatin);letter-spacing:3px;text-transform:uppercase;
  font-size:.66rem;color:var(--gold);margin-bottom:.25rem}
.char-meta .nm{font-family:var(--ftitle);font-weight:700;color:#fff;font-size:1.08rem;line-height:1.25}
.char-meta .more{margin-top:.4rem;font-family:var(--fsans);font-size:.72rem;color:var(--rose-soft);
  letter-spacing:1px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.char-card:hover .char-meta .more,.char-card:focus-visible .char-meta .more{opacity:1;transform:none}

.world-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin-bottom:2.6rem}
.nation{background:var(--panel);border:1px solid var(--bdr);border-radius:16px;padding:1.7rem 1.5rem;
  transition:transform .3s,border-color .3s}
.nation:hover{transform:translateY(-4px);border-color:var(--gold-d)}
.nation .tag{font-family:var(--flatin);letter-spacing:3px;text-transform:uppercase;font-size:.7rem;
  color:var(--rose);margin-bottom:.6rem}
.nation h3{font-family:var(--ftitle);font-weight:700;color:var(--gold-soft);font-size:1.18rem;margin-bottom:.7rem;line-height:1.3}
.nation p{color:var(--muted);font-size:.92rem;line-height:1.7}
.nation h3 .pin{color:var(--rose-soft);font-size:.72rem;font-family:var(--fsans);margin-left:.4rem;letter-spacing:0}
.minor{display:flex;flex-wrap:wrap;gap:.7rem}
.minor span{font-size:.82rem;color:var(--muted);background:var(--bg3);border:1px solid var(--bdr);
  border-radius:3px;padding:.4rem .9rem}
.minor span b{color:var(--gold-soft);font-weight:600}

.system{background:linear-gradient(180deg,var(--bg2),var(--bg))}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-top:.6rem}
.rung{background:var(--panel);border:1px solid var(--bdr);border-radius:14px;padding:1.1rem 1rem;text-align:center;
  position:relative;transition:transform .3s,border-color .3s}
.rung:hover{transform:translateY(-4px);border-color:var(--rose-d)}
.rung .lv{font-family:var(--flatin);letter-spacing:2px;color:var(--rose);font-size:.74rem;text-transform:uppercase}
.rung .zone{font-family:var(--ftitle);color:var(--gold-soft);font-weight:700;margin:.4rem 0;font-size:.95rem}
.rung .note{color:var(--muted);font-size:.8rem;line-height:1.5}
.cmd{margin-top:2.4rem;display:flex;flex-wrap:wrap;gap:1rem}
.cmd code{font-family:'Consolas',ui-monospace,monospace;background:var(--bg3);border:1px solid var(--bdr2);
  border-radius:10px;padding:.7rem 1rem;color:var(--gold-soft);font-size:.88rem}
.cmd code b{color:var(--rose-soft)}
.cmd code span{color:var(--muted);font-family:var(--fsans);font-size:.8rem;margin-left:.5rem}

.prologue{position:relative;overflow:hidden}
.prologue-bg{position:absolute;inset:0;z-index:0}
.prologue-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.32) saturate(1.1)}
.prologue-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),rgba(14,10,11,.7) 30%,rgba(14,10,11,.85))}
.prologue-inner{position:relative;z-index:2}
.scene{max-width:680px;margin:0 auto;background:rgba(12,8,9,.62);border:1px solid var(--bdr2);
  border-radius:18px;padding:clamp(1.5rem,5vw,2.6rem);backdrop-filter:blur(3px)}
.hud{font-family:'Consolas',ui-monospace,monospace;color:var(--gold-soft);font-size:.78rem;
  letter-spacing:.3px;border-bottom:1px solid var(--bdr);padding-bottom:.9rem;margin-bottom:1.4rem}
.scene p{color:var(--body);margin-bottom:.95rem;font-size:1rem;line-height:1.9}
.scene .line{font-family:var(--ftitle);color:#fff}
.scene .line b{color:var(--green);font-weight:700;margin-right:.5rem}
.scene .em{color:var(--rose-soft);font-style:italic;font-family:var(--ftitle)}
.statusbox{margin-top:1.6rem;font-family:'Consolas',ui-monospace,monospace;font-size:.78rem;line-height:2;
  color:var(--muted);background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:1.1rem 1.2rem}
.statusbox b{color:var(--gold-soft)}

.cta{text-align:center}
.cta .h2{margin-bottom:1rem}
.cta p{color:var(--muted);max-width:52ch;margin:0 auto 2rem}
.cta-btn{display:inline-block;font-family:var(--fsans);font-weight:600;letter-spacing:3px;
  color:#1a1012;background:linear-gradient(135deg,var(--rose-soft),var(--rose-d));
  border:none;border-radius:3px;padding:.8rem 2.6rem;font-size:.92rem;cursor:pointer;
  box-shadow:0 8px 26px rgba(224,154,174,.28);transition:transform .25s,box-shadow .25s}
.cta-btn:hover,.cta-btn:focus-visible{transform:translateY(-3px);box-shadow:0 14px 44px rgba(224,154,174,.5);outline:none}
footer{text-align:center;color:var(--dim);font-size:.78rem;letter-spacing:.5px;
  padding:2.6rem 1.3rem 3rem;border-top:1px solid var(--bdr)}
footer b{color:var(--muted)}

/* ===== BGM player ===== */
.bgm{position:fixed;right:1rem;bottom:1rem;z-index:120;display:flex;align-items:center;gap:.55rem;
  background:rgba(20,15,16,.55);border:1px solid var(--bdr2);border-radius:7px;padding:.42rem .7rem;
  backdrop-filter:blur(8px);opacity:.65;transition:opacity .25s}
.bgm:hover,.bgm:focus-within{opacity:1}
.bgm-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:none;
  border:none;color:var(--rose-soft);font-size:.74rem;cursor:pointer;border-radius:4px;
  text-shadow:0 0 10px var(--rose-glow);transition:color .2s}
.bgm-btn:hover,.bgm-btn:focus-visible{color:#fff;outline:none}
.bgm-vol{width:62px;height:3px;accent-color:var(--rose);cursor:pointer}
@media(max-width:560px){ .bgm{right:.6rem;bottom:.6rem;padding:.38rem .55rem} .bgm-vol{width:48px} }

.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:1.2rem;background:rgba(6,4,5,.82);backdrop-filter:blur(6px)}
.modal.open{display:flex;animation:mfade .3s ease}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal-card{position:relative;width:min(640px,100%);max-height:90vh;overflow:auto;
  background:var(--bg2);border:1px solid var(--bdr2);border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);animation:mup .35s ease}
@keyframes mup{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.modal-banner{position:relative;aspect-ratio:3/2;overflow:hidden}
.modal-banner img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.modal-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2),transparent 50%)}
.modal-close{position:absolute;top:.7rem;right:.7rem;z-index:3;width:38px;height:38px;border-radius:50%;
  background:rgba(10,7,8,.6);border:1px solid var(--bdr2);color:var(--body);font-size:1.2rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.modal-close:hover,.modal-close:focus-visible{background:var(--rose-d);color:#fff;transform:rotate(90deg);outline:none}
.modal-body{padding:0 clamp(1.3rem,4vw,2rem) clamp(1.5rem,4vw,2rem)}
.modal-role{font-family:var(--flatin);letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-size:.78rem}
.modal-name{font-family:var(--ftitle);font-weight:700;color:#fff;font-size:1.6rem;margin:.2rem 0 1.1rem}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem 1.4rem;margin-bottom:1.4rem}
.stat{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dashed var(--bdr);padding-bottom:.5rem;font-size:.87rem}
.stat .k{color:var(--muted)}
.stat .v{color:var(--gold-soft);text-align:right}
.modal-desc{color:var(--body);font-size:.96rem;line-height:1.9;margin-bottom:1.3rem}
.modal-desc .quote{display:block;margin-top:1rem;padding-left:1rem;border-left:2px solid var(--rose-d);
  color:var(--rose-soft);font-family:var(--ftitle);font-style:italic}
.relline{font-family:var(--fsans);font-size:.82rem;color:var(--muted);background:var(--bg3);

/* ============ render ============ */
let LANG = 'en';
let CHARS = I18N.en.chars;

function render(lang){
  const t = I18N[lang]; if(!t) return;
  LANG = lang; CHARS = t.chars;
  document.documentElement.lang = lang;
  document.title = t.docTitle;

  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t[el.dataset.i18n] ?? ''; });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t[el.dataset.i18nHtml] ?? ''; });

  // synopsis points
  document.getElementById('synPoints').innerHTML = t.synPoints.map(p=>`<li>${p}</li>`).join('');

  // characters
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  Object.entries(t.chars).forEach(([id,c])=>{
    const b = document.createElement('button');
    b.className = 'char-card';
    b.setAttribute('aria-label', c.name);
    b.dataset.id = id;
    b.innerHTML = `
      <div class="char-thumb"><img src="${c.card}" alt="${c.name}" width="900" height="616" loading="lazy"></div>
      <div class="char-meta">
        <p class="role">${c.role.split('·')[0].trim()}</p>
        <p class="nm">${c.name}</p>
        <p class="more">${t.charMore}</p>
      </div>`;
    b.addEventListener('click', ()=>openModal(id));
    grid.appendChild(b);
  });

  // world
  document.getElementById('worldGrid').innerHTML = t.nations.map(n=>`
    <div class="nation"><p class="tag">${n.tag}</p>
      <h3>${n.h3}<span class="pin">${n.pin}</span></h3><p>${n.p}</p></div>`).join('');
  document.getElementById('minor').innerHTML = t.minor.map(m=>`<span>${m}</span>`).join('');


  // modal close aria
  document.getElementById('mClose').setAttribute('aria-label', t.closeLabel);

  // active lang button
  document.querySelectorAll('#langSw button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang===lang);
  });
}

/* ============ modal ============ */
const modal = document.getElementById('modal');
const mBanner=document.getElementById('mBanner'), mRole=document.getElementById('mRole'),
      mName=document.getElementById('mName'), mStats=document.getElementById('mStats'),
      mDesc=document.getElementById('mDesc'), mRel=document.getElementById('mRel'),
      mClose=document.getElementById('mClose');
let lastFocus=null;

function openModal(id){
  const c=CHARS[id]; if(!c) return;
  lastFocus=document.activeElement;
  mBanner.src=c.card; mBanner.alt=c.name;
  mRole.textContent=c.role;
  mName.textContent=c.name;
  mStats.innerHTML=c.stats.map(([k,v])=>`<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  mDesc.innerHTML=c.desc;
  const r=c.rel;
  mRel.innerHTML=`<span class="ic">${r.ic}</span><b>${r.label}</b> ${I18N[LANG].relLabel}`+
    r.stages.map((s,i)=> i===r.now ? `<span class="now">${s}</span>` : s).join(' → ');
  modal.classList.add('open');
  document.body.classList.add('locked');
  mClose.focus();
}
function closeModal(){
  modal.classList.remove('open');
  document.body.classList.remove('locked');
  if(lastFocus) lastFocus.focus();
}
mClose.addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('open')) closeModal(); });
modal.addEventListener('keydown', e=>{
  if(e.key!=='Tab') return;
  const els=[...modal.querySelectorAll('button, [href]')].filter(el=>el.offsetParent!==null);
  if(!els.length) return;
  const first=els[0], last=els[els.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* ============ English only ============ */
// 언어 선택 화면 없이 영어로 바로 시작. 브라우저가 자동재생을 막으면 첫 클릭/터치/키 입력 때 BGM 시작
function firstGesture(){ startBgm(); window.removeEventListener('pointerdown',firstGesture); window.removeEventListener('keydown',firstGesture); }
window.addEventListener('pointerdown',firstGesture);
window.addEventListener('keydown',firstGesture);

/* ============ play button ============ */
document.getElementById('playBtn').addEventListener('click', e=>{
  const PLAY_URLS = {
    en:"https://imyn.ai/contents/89523c88-1500-4d82-9028-27e4e3833787"
  };
  const url = PLAY_URLS[LANG] || "";
  if(url){ window.open(url,'_blank','noopener'); }
  else { e.preventDefault(); alert(I18N[LANG].playAlert); }
});

/* ============ nav smooth scroll ============ */
document.querySelectorAll('.menu a[data-scroll]').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    const t=document.querySelector(a.dataset.scroll);
    if(t) t.scrollIntoView({behavior:'smooth'});
  });
});

/* ============ petals ============ */
const petalLayer=document.getElementById('petals');
const N=window.matchMedia('(max-width:560px)').matches ? 8 : 16;
for(let i=0;i<N;i++){
  const p=document.createElement('span');
  p.className='petal'; p.textContent='❀';
  p.style.left=((i*100/N)+(i%3)*4)+'%';
  p.style.fontSize=(10+(i%4)*4)+'px';
  p.style.animationDuration=(10+(i%5)*3)+'s';
  p.style.animationDelay=(-(i%7)*2)+'s';
  petalLayer.appendChild(p);
}

/* ============ BGM player ============ */
const bgmAudio=document.getElementById('bgmAudio');
const bgmToggle=document.getElementById('bgmToggle');
const bgmVol=document.getElementById('bgmVol');
bgmAudio.volume=parseFloat(bgmVol.value);
function bgmIcon(){ bgmToggle.textContent = bgmAudio.paused ? '▶' : '❚❚'; }
function startBgm(){ bgmAudio.play().catch(()=>{}); }
bgmToggle.addEventListener('click', ()=>{ if(bgmAudio.paused) startBgm(); else bgmAudio.pause(); });
bgmAudio.addEventListener('play', bgmIcon);
bgmAudio.addEventListener('pause', bgmIcon);
bgmVol.addEventListener('input', ()=>{ bgmAudio.volume=parseFloat(bgmVol.value); });
bgmIcon();

/* initial render (content behind intro) */
render('en');
startBgm();
</script>
